<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сертификаты стажировки · Red Collar</title><link rel="icon" type="image/png" href="assets/images/favicon.png"><style>@font-face{font-family:Commons;src:url(assets/fonts/commons.otf)}@font-face{font-family:Commons;src:url(assets/fonts/commons-2.otf);font-weight:600}@font-face{font-family:Redcollar;src:url(assets/fonts/redcollar.otf)}*{box-sizing:border-box}body{margin:0;color:#202020;background:#f1f1f1;font:16px Commons,Arial,sans-serif}header{height:82px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:35px;padding:0 32px}header strong{font:24px Redcollar,Arial,sans-serif;letter-spacing:-1px}header span{color:#666}button,input,select{font:inherit}button{cursor:pointer;border:0}header button{margin-left:auto;background:#ff3c3c;color:white;padding:15px 24px;border-radius:9px}button:disabled{opacity:.45;cursor:not-allowed}main{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:calc(100vh - 82px)}aside{background:#fff;padding:28px;border-right:1px solid #ddd}h1{font-size:23px;margin:0 0 26px}h2{font-size:21px;margin:0}label{display:block;margin:0 0 20px;color:#555;font-size:15px}input,select{width:100%;display:block;border:1px solid #dedede;border-radius:7px;background:#fafafa;color:#202020;padding:12px;margin-top:8px;min-width:0;outline:none}input:focus,select:focus{border-color:#333;box-shadow:0 0 0 2px #00000008}input[aria-invalid=true]{border-color:#e52e2e;background:#fff2f2}small{display:block;font-size:13px;color:#888;margin-top:7px}.dates{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dates label{margin-bottom:0}.dates input{padding:11px 6px;font-size:14px}.error{color:#c32323;font-size:14px;margin:8px 0 20px}.error:empty{margin:0 0 20px}.skills-editor{border-top:1px solid #e5e5e5;padding-top:24px;margin-top:28px}.section-heading{display:flex;align-items:center;justify-content:spa main{grid-template-columns:minmax(0,1fr) 400px}.workspace{grid-column:1;grid-row:1}aside{grid-column:2;grid-row:1;border-right:0;border-left:1px solid #ddd;padding:28px}header .brand-logo{width:150px;max-height:35px;object-fit:contain}header button:hover:not(:disabled){background:#000}header button{transition:background .18s}input,select,.date-trigger{min-height:52px;background-color:#fafafa;border-radius:7px}select{appearance:none;-webkit-appearance:none;background-image:url("assets/images/chevron-down.svg");background-position:right 14px center;background-repeat:no-repeat;padding-right:38px}.dates{align-items:start;gap:12px}.dates label{font-size:14px;white-space:nowrap}.date-trigger{display:block;width:100%;margin-top:8px;padding:12px 8px;border:1px solid #dedede;text-align:center;color:#202020;font-size:16px;font-family:CommonsDemi,Commons,sans-serif;font-weight:600}.date-trigger[aria-invalid=true]{border-color:#e52e2e;background:#fff2f2}#skills{height:290px;overflow-y:auto;overscroll-behavior:contain;padding-right:8px;scrollbar-width:thin;scrollbar-color:#bdbdbd transparent}#skills::-webkit-scrollbar{width:5px}#skills::-webkit-scrollbar-thumb{background:#bdbdbd;border-radius:8px}.skill-row input{min-height:46px}.calendar{border:1px solid #ddd;border-radius:14px;padding:24px;width:390px;max-width:calc(100vw - 32px);color:#222;box-shadow:0 20px 90px #0002}.calendar::backdrop{background:#0003}.calendar-title{font-size:22px;margin:0 0 20px}.calendar-nav{display:flex;align-items:center;gap:8px;margin-bottom:20px}.calendar-nav select{margin:0;min-height:44px;padding:8px 28px 8px 10px;flex:1;width:auto}.calendar-nav button{background:#f4f4f4;border-radius:6px;width:34px;height:44px;font-size:22px}.calendar-week,.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calendar-week span{text-align:center;font-size:14px;color:#888;padding:8px 0}.calendar-days button{aspect-ratio:1;background:none;border-radius:7px;color:#222;font-size:17px}.calendar-days button:hover{background:#eee}.calendar-days button[aria-pressed=true]{background:#202020;color:white}.calendar-days .today{box-shadow:inset 0 0 0 1px #ddd}.calendar-footer{display:flex;justify-content:space-between;margin-top:20px}.calendar-footer button{background:#f2f2f2;padding:11px 16px;border-radius:7px;font-size:16px}@media(min-width:1500px){main{grid-template-columns:minmax(0,1fr) 420px}}@media(max-width:850px){main{display:flex}.workspace{order:-1}aside{border-left:0}.calendar{padding:20px}header .brand-logo{width:125px}}
</style></head><body><header><img class="brand-logo" alt="Red Collar" src="assets/images/brand-logo.svg"><span>Сертификат стажировки</span><button id="export" disabled>Скачать PDF</button></header><main><aside><form id="form" novalidate><h1>Данные сертификата</h1><label>Направление<select id="direction"><option>QA</option><option>Java разработка</option><option>Python разработка</option><option>Flutter разработчик</option><option>Frontend Разработчик</option><option>Аналитика</option><option>Дизайн</option></select></label><div class="dates"><label>Дата начала<input type="hidden" id="start" value="2026-03-23"><button class="date-trigger" type="button" id="start-trigger" aria-haspopup="dialog" aria-label="Дата начала" aria-describedby="date-error"></button></label><label>Дата окончания<input type="hidden" id="end" value="2026-06-30"><button class="date-trigger" type="button" id="end-trigger" aria-haspopup="dialog" aria-label="Дата окончания" aria-describedby="date-error"></button></label></div><p id="date-error" class="error" aria-live="polite"></p><label>Пол<select id="gender"><option value="female">Женский</option><option value="male">Мужской</option></select></label><label>Выдан<input id="recipient" value="Васянович Елене" required maxlength="120"><small>В дательном падеже</small></label><label>Роль руководителя<select id="role"><option value="Лид направления">Лид направления</option><option value="Ментор">Ментор</option><option value="Руководитель отдела">Руководитель отдела</option><option value="other">Другое</option></select></label><label id="role-custom-wrap" style="display:none">Свое значение<input id="role-custom" type="text" placeholder="Введите свое значение" maxlength="120"></label><label>От кого<input id="sender" value="Валерия Клетцова" required maxlength="120"><small>В именительном падеже</small></label><section class="skills-editor"><div class="section-heading"><h2>Навыки <span id="count"></span></h2><button type="button" id="add">+ Добавить</button></div><p class="hint">Каждый навык — отдельный пункт. Строки распределяются автоматически.</p><div id="skills"></div></section></form></aside><section class="workspace"><div class="preview-heading"><span>Предпросмотр</span><span>2048 × 1447 px · PDF</span></div><canvas id="certificate" width="2048" height="1447" role="img" aria-label="Предпросмотр сертификата"></canvas><p id="status" role="status">Загружаем шрифты и изображения…</p></section></main><dialog id="calendar" class="calendar" aria-labelledby="calendar-title"><h2 class="calendar-title" id="calendar-title">Выберите дату</h2><div class="calendar-nav"><button type="button" id="cal-prev" aria-label="Предыдущий месяц">‹</button><select id="cal-month" aria-label="Месяц"></select><select id="cal-year" aria-label="Год"></select><button type="button" id="cal-next" aria-label="Следующий месяц">›</button></div><div class="calendar-week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div id="cal-days" class="calendar-days"></div><div class="calendar-footer"><button type="button" id="cal-today">Сегодня</button><button type="button" id="cal-close">Закрыть</button></div></dialog><script>'use strict';
const $=id=>document.getElementById(id),canvas=$('certificate'),ctx=canvas.getContext('2d');
const skills=['Методологии разработки','Клиент-серверная архитектура','Баг-трекинг','API, REST, SOAP','Postman','Browserstack','Swagger','Dev Tools','Terminal','Charles Proxy','Информационная безопасность','HTML','CSS','GIT','Soft skills','SQL','Тестовая документация','Figma','JSON, XML'];
let ready=false,art={},frame=0;
function skillInputs(){const host=$('skills');host.replaceChildren();skills.forEach((value,i)=>{const row=document.createElement('div');row.className='skill-row';const input=document.createElement('input');input.value=value;input.setAttribute('aria-label',`Навык ${i+1}`);input.maxLength=180;input.addEventListener('input',()=>{skills[i]=input.value;schedule()});const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label',`Удалить навык ${i+1}`);remove.onclick=()=>{skills.splice(i,1);skillInputs();schedule()};row.append(input,remove);host.append(row)});$('count').textContent=skills.length;}
$('add').onclick=()=>{skills.push('');skillInputs();$('skills').lastElementChild.querySelector('input').focus();schedule()};
$('form').addEventListener('submit',e=>e.preventDefault());$('form').addEventListener('input',schedule);$('form').addEventListener('change',schedule);function updateRoleCustom(){const isOther=$('role').value==='other';$('role-custom-wrap').style.display=isOther?'block':'none';if(!isOther)$('role-custom').value='';schedule();}$('role').addEventListener('change',updateRoleCustom);
function schedule(){cancelAnimationFrame(frame);frame=requestAnimationFrame(render)}
function font(size,family='Commons',weight=500,spacing=-.03){ctx.font=`${weight} ${size}px ${family}`;ctx.letterSpacing=`${size*spacing}px`;ctx.fillStyle='#fff';ctx.textBaseline='alphabetic'}
function text(s,x,y,size=36,family='Commons',weight=500,spacing=-.03){font(size,family,weight,spacing);ctx.fillText(s,x,y)}
function wrap(s,max){const lines=[];let line='';for(const word of s.trim().split(/\s+/)){const next=line?line+' '+word:word;if(ctx.measureText(next).width>max&&line){lines.push(line);line=word}else line=next;}if(line)lines.push(line);return lines;}
function nameText(s,x,y,w){let size=57,lines;do{font(size);lines=wrap(s,w);if(lines.length<=2&&lines.every(l=>ctx.measureText(l).width<=w))break;size--;}while(size>32);lines.slice(0,2).forEach((l,i)=>ctx.fillText(l,x,y+i*size*.95));return lines.length>2||lines.some(l=>ctx.measureText(l).width>w);}
function skillLayout(items,width=970,size=26){
 const minGap=22,maxGap=50; font(size,'Commons',500,-.03);
 const widths=items.map(value=>ctx.measureText(value).width);
 if(widths.some(w=>w>width))return {error:'Один из навыков слишком длинный. Сократите его текст.'};
 const n=items.length,cost=Array(n+1).fill(Infinity),next=Array(n);cost[n]=0;
 for(let i=n-1;i>=0;i--){let sum=0;for(let j=i;j<n;j++){sum+=widths[j];const count=j-i+1;if(sum+minGap*(count-1)>width)break;
 const gap=count>1?(width-sum)/(count-1):width-sum;
 const holes=Math.max(0,gap-maxGap);const penalty=10000+holes*holes+(count===1&&n>1?8000:0);
 if(penalty+cost[j+1]<cost[i]){cost[i]=penalty+cost[j+1];next[i]=j+1;}}}
 const rows=[];for(let i=0;i<n;){const j=next[i];if(!j)return {error:'Не удалось разместить навыки.'};rows.push(items.slice(i,j).map((text,k)=>({text,width:widths[i+k]})));i=j;}
 return {rows,height:rows.length?rows.length*(size+12)-12:0,size,maxGap};}
function date(s){return s?s.split('-').reverse().join('.'):'';}
let background;
function render(){const badDate=Boolean($('start').value&&$('end').value&&$('end').value<$('start').value);$('end').setAttribute('aria-invalid',String(badDate));$('end-trigger').setAttribute('aria-invalid',String(badDate));$('date-error').textContent=badDate?'Дата окончания не может быть раньше даты начала.':'';if(!ready)return;ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(background,0,0,canvas.width,canvas.height);ctx.scale(canvas.width/1684,canvas.width/1684);ctx.save();ctx.globalCompositeOperation='screen';ctx.drawImage(art[$('gender').value],1075,219,761,970);ctx.restore();if(art.logo)ctx.drawImage(art.logo,1237,60,387,58.855);
text('Сертификат',60,119,80);text('о прохождении стажировки',60,188,56);text('по направлению',60,231,56);
const d=$('direction').value;let titleLines=[d],titleSize=d==='QA'?177:159;if(d.includes(' ')){titleLines=d.split(' ');titleSize=120;}
titleLines.forEach((s,i)=>text(s,60,477+i*101,titleSize,'Redcollar',400,-.01));const shift=titleLines.length>1?53:0;
text('с '+date($('start').value),60,594+shift,36,'CommonsDemi',600);font(36,'CommonsDemi',600);const dateX=60+ctx.measureText('с '+date($('start').value)).width+48;text('по '+date($('end').value),dateX,594+shift,36,'CommonsDemi',600);
text('Выдан',60,759+shift);const roleValue=$('role').value==='other'?$('role-custom').value.trim():$('role').value;text(roleValue,623,759+shift);const overflowName=nameText($('recipient').value,60,829+shift,475)|nameText($('sender').value,623,829+shift,407);
const items=skills.map(s=>s.trim()).filter(Boolean);const areaTop=920+shift,areaBottom=1133;let layout=skillLayout(items);for(let size=25;size>=20&&(layout.error||layout.height>areaBottom-areaTop);size--)layout=skillLayout(items,970,size);let issue=layout.error||'';
if(!issue&&layout.height>areaBottom-areaTop)issue='Навыки не помещаются в сертификат. Сократите список или текст пунктов.';
if(!layout.error){font(layout.size);const top=areaBottom-layout.height+layout.size*.77;layout.rows.forEach((row,i)=>{const total=row.reduce((a,b)=>a+b.width,0),gap=row.length>1?Math.min(layout.maxGap,(970-total)/(row.length-1)):0;let x=60;row.forEach(item=>{ctx.fillText(item.text,x,top+i*(layout.size+12));x+=item.width+gap})});}
const missing=['recipient','sender','start','end'].some(id=>!$(id).value.trim())||($('role').value==='other'&&!$('role-custom').value.trim());if(overflowName)issue='Имя слишком длинное для макета. Сократите его.';
$('status').textContent=issue||(missing?'Заполните имя получателя, имя руководителя и обе даты.':'');$('export').disabled=badDate||missing||Boolean(issue);return {valid:!$('export').disabled,skills:items.length};}
function pdfFromJpeg(jpeg,width,height){const enc=new TextEncoder(),chunks=[],offsets=[0];let pos=0;const push=data=>{const bytes=typeof data==='string'?enc.encode(data):data;chunks.push(bytes);pos+=bytes.length};push('%PDF-1.4\n');function obj(n,body){offsets[n]=pos;push(`${n} 0 obj\n${body}\nendobj\n`)}obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${width*.75} ${height*.75}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);offsets[4]=pos;push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);push(jpeg);push('\nendstream\nendobj\n');const commands=`q\n${width*.75} 0 0 ${height*.75} 0 0 cm\n/Im0 Do\nQ\n`;obj(5,`<< /Length ${enc.encode(commands).length} >>\nstream\n${commands}endstream`);const xref=pos;push('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<6;i++)push(String(offsets[i]).padStart(10,'0')+' 00000 n \n');push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(chunks,{type:'application/pdf'});}
$('export').onclick=async()=>{if(!render()?.valid)return;const button=$('export');button.disabled=true;button.textContent='Готовим PDF…';try{const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('export')),'image/jpeg',.98));const pdf=pdfFromJpeg(new Uint8Array(await blob.arrayBuffer()),canvas.width,canvas.height);const url=URL.createObjectURL(pdf),a=document.createElement('a');a.href=url;a.download='Сертификат — '+$('recipient').value.replace(/[\\/:*?"<>|]/g,'')+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}catch(e){$('status').textContent='Не удалось создать PDF. Попробуйте ещё раз.';}finally{button.textContent='Скачать PDF';render();}};
function imageLoad(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
skillInputs();
Promise.all([document.fonts.load('500 36px Commons'),document.fonts.load('600 36px CommonsDemi'),document.fonts.load('400 120px Redcollar'),imageLoad('assets/images/embedded-1.png'),imageLoad('assets/images/embedded-2.png'),imageLoad('assets/images/embedded-2.svg'),imageLoad('assets/images/embedded-3.png')]).then(values=>{art={female:values[3],male:values[4],logo:values[5]};background=values[6];ready=true;render()}).catch(()=>{$('status').textContent='Не удалось загрузить оформление сертификата. Обновите страницу.'});
if(document.modelContext?.registerTool){Promise.resolve(document.modelContext.registerTool({name:'set_certificate_skills',description:'Заменить список навыков в открытом сертификате',inputSchema:{type:'object',properties:{skills:{type:'array',items:{type:'string',maxLength:180},maxItems:100}},required:['skills'],additionalProperties:false},execute(input){if(!Array.isArray(input?.skills)||input.skills.length>100||input.skills.some(s=>typeof s!=='string'||s.length>180))throw Error('Некорректный список навыков');skills.splice(0,skills.length,...input.skills);skillInputs();updateRoleCustom();const result=render();return result||{ready:false};}})).catch(()=>{});}

const calendar=$('calendar');let calendarTarget='start',calendarYear=2026,calendarMonth=0;
const monthNames=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function isoDate(y,m,d){return String(y).padStart(4,'0')+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function syncDates(){for(const id of ['start','end'])$(id+'-trigger').textContent=date($(id).value);}
function chooseDate(value){$(calendarTarget).value=value;syncDates();calendar.close();$(calendarTarget+'-trigger').focus();render();}
function drawCalendar(){
 $('cal-month').replaceChildren();monthNames.forEach((name,i)=>{const o=new Option(name,String(i));o.selected=i===calendarMonth;$('cal-month').append(o)});
 $('cal-year').replaceChildren();for(let y=Math.min(1950,calendarYear);y<=Math.max(2100,calendarYear);y++){const o=new Option(String(y),String(y));o.selected=y===calendarYear;$('cal-year').append(o)}
 const host=$('cal-days');host.replaceChildren();const offset=(new Date(calendarYear,calendarMonth,1).getDay()+6)%7;
 for(let i=0;i<offset;i++)host.append(document.createElement('span'));
 const now=new Date(),today=isoDate(now.getFullYear(),now.getMonth(),now.getDate());
 for(let day=1;day<=new Date(calendarYear,calendarMonth+1,0).getDate();day++){const value=isoDate(calendarYear,calendarMonth,day),button=document.createElement('button');button.type='button';button.textContent=day;button.setAttribute('aria-label',date(value));button.setAttribute('aria-pressed',String($(calendarTarget).value===value));if(value===today)button.className='today';button.onclick=()=>chooseDate(value);host.append(button);}}
for(const id of ['start','end'])$(id+'-trigger').onclick=()=>{calendarTarget=id;const parts=$(id).value.split('-').map(Number);calendarYear=parts[0];calendarMonth=parts[1]-1;$('calendar-title').textContent=id==='start'?'Дата начала':'Дата окончания';drawCalendar();calendar.showModal();const selected=$('cal-days').querySelector('[aria-pressed=true]');if(selected)selected.focus();};
$('cal-month').onchange=()=>{calendarMonth=Number($('cal-month').value);drawCalendar()};$('cal-year').onchange=()=>{calendarYear=Number($('cal-year').value);drawCalendar()};
function stepMonth(delta){const d=new Date(calendarYear,calendarMonth+delta,1);calendarYear=d.getFullYear();calendarMonth=d.getMonth();drawCalendar();}
$('cal-prev').onclick=()=>stepMonth(-1);$('cal-next').onclick=()=>stepMonth(1);$('cal-close').onclick=()=>calendar.close();$('cal-today').onclick=()=>{const n=new Date();chooseDate(isoDate(n.getFullYear(),n.getMonth(),n.getDate()))};
calendar.addEventListener('click',event=>{if(event.target===calendar){const r=calendar.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)calendar.close();}});syncDates();
</script></body></html>
